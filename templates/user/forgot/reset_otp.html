{% extends "user/base.html" %}

{% block content %}
<!--====== App Content ======-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

<style>
    /* [Existing styles unchanged] */
    .error-message {
        color: #d9534f;
        font-size: 14px;
        margin-bottom: 15px;
        text-align: center;
    }
</style>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>

<div class="app-content">
    {% if messages %}
    <script>
        {% for message in messages %}
            showToastMessage("{{ message|escapejs }}", "{{ message.tags }}");
        {% endfor %}
    </script>
    {% endif %}

    <!--====== Section 2 ======-->
    <br><br>
    <div class="u-s-p-b-30">
        <!--====== Section Intro ======-->
        <br><br>
        <div class="section__intro u-s-p-b-30">
            <div class="container">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="section__text-wrap">
                            <h1 class="section__heading u-c-secondary">OTP VERIFICATION</h1>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!--====== End - Section Intro ======-->

        <!--====== Section Content ======-->
        <div class="section__content">
            <div class="container">
                <div class="row row--center">
                    <div class="col-lg-6 col-md-8 u-s-m-b-30">
                        <div class="l-f-o">
                            <div class="l-f-o__pad-box">
                                <h1 class="gl-h1">OTP VERIFICATION</h1>
                                <span class="gl-text u-s-m-b-30">Enter OTP sent to email</span>
                                {% if error %}
                                    <div class="error-message" role="alert">{{ error }}</div>
                                {% endif %}
                                <form class="l-f-o__form" method="post" id="otp-form" action="{% url 'otp_verify' %}">
                                    {% csrf_token %}
                                    <div class="u-s-m-b-30">
                                        <label class="gl-label" for="otp">OTP *</label>
                                        <input class="input-text input-text--primary-style" name="otp" id="otp" type="text" placeholder="Enter OTP" maxlength="{{ otp_length|default:6 }}" pattern="\d*" inputmode="numeric" required aria-describedby="otp-error">
                                    </div>
                                    <div class="gl-inline">
                                        <div class="u-s-m-b-30">
                                            <button class="btn btn--e-transparent-brand-b-2" type="submit" aria-label="Verify OTP">VERIFY</button>
                                        </div>
                                        <div class="u-s-m-b-30">
                                            <p>OTP will expire in: <span id="timer" aria-live="polite">{{ remaining_time|default:60 }}s</span></p>
                                            <a class="gl-link resend-otp-link disabled" href="#" data-url="{% url 'reset_resend_otp' %}" aria-label="Resend OTP">Resend OTP</a>
                                        </div>
                                    </div>
                                    <div class="u-s-m-b-30">
                                        <a class="gl-link" href="{% url 'login' %}" aria-label="Back to Login">Back to Login</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!--====== End - Section Content ======-->
    </div>
    <!--====== End - Section 2 ======-->
</div>
<!--====== End - App Content ======-->

<script>
$(document).ready(function() {
    // CSRF token setup
    function getCsrfToken() {
        return $('input[name="csrfmiddlewaretoken"]').val();
    }
    $.ajaxSetup({
        headers: { 'X-CSRFToken': getCsrfToken() }
    });

    // Sanitize OTP input to allow only numbers
    $('input[name="otp"]').on('input', function() {
        this.value = this.value.replace(/[^0-9]/g, '');
    });

    // OTP form submission with client-side validation
    $('#otp-form').on('submit', function(event) {
        event.preventDefault();
        const otp = $('input[name="otp"]').val().trim();
        const otpLength = {{ otp_length|default:6 }};
        if (!otp) {
            Swal.fire({
                icon: 'error',
                title: 'Invalid Input',
                text: 'Please enter the OTP.',
                confirmButtonColor: '#000',
                customClass: { icon: 'black-icon' }
            });
            return;
        }
        if (!new RegExp(`^\\d{${otpLength}}$`).test(otp)) {
            Swal.fire({
                icon: 'error',
                title: 'Invalid OTP',
                text: `OTP must be a ${otpLength}-digit number.`,
                confirmButtonColor: '#000',
                customClass: { icon: 'black-icon' }
            });
            return;
        }
        $('.preloader').addClass('is-active');
        $.ajax({
            type: 'POST',
            url: $(this).attr('action'),
            data: $(this).serialize(),
            dataType: 'json',
            success: function(response) {
                $('.preloader').removeClass('is-active');
                if (response.status === 'success') {
                    Swal.fire({
                        icon: 'success',
                        title: 'OTP Verified!',
                        text: 'Redirecting to reset password...',
                        confirmButtonColor: '#000',
                        customClass: { icon: 'black-icon' }
                    }).then(() => {
                        window.location.href = response.redirect_url;
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Verification Failed',
                        text: response.message || 'Invalid OTP. Please try again.',
                        confirmButtonColor: '#000',
                        customClass: { icon: 'black-icon' }
                    });
                }
            },
            error: function(xhr) {
                $('.preloader').removeClass('is-active');
                let errorMessage = 'An unexpected error occurred.';
                if (xhr.responseJSON && xhr.responseJSON.message) {
                    errorMessage = xhr.responseJSON.message;
                }
                Swal.fire({
                    icon: 'error',
                    title: 'Oops...',
                    text: errorMessage,
                    confirmButtonColor: '#000',
                    customClass: { icon: 'black-icon' }
                });
            }
        });
    });

    // OTP timer
    let otpExpiryTime = parseInt('{{ remaining_time|default:60 }}');
    const timerElement = $('#timer');
    const resendLink = $('.resend-otp-link');
    function startTimer() {
        timerElement.text(`${otpExpiryTime}s`);
        resendLink.addClass('disabled').text('Resend OTP (wait)');
        let countdownTimer = setInterval(() => {
            if (otpExpiryTime <= 0) {
                clearInterval(countdownTimer);
                timerElement.text('OTP has expired.');
                resendLink.removeClass('disabled').text('Resend OTP');
                Swal.fire({
                    icon: 'warning',
                    title: 'OTP Expired',
                    text: 'Please request a new OTP.',
                    confirmButtonColor: '#000',
                    customClass: { icon: 'black-icon' }
                });
            } else {
                let minutes = Math.floor(otpExpiryTime / 60);
                let seconds = otpExpiryTime % 60;
                timerElement.text(`${minutes}m ${seconds < 10 ? '0' : ''}${seconds}s`);
                otpExpiryTime--;
            }
        }, 1000);
        return countdownTimer;
    }
    let countdownTimer = startTimer();

    // Resend OTP
    resendLink.on('click', function(event) {
        event.preventDefault();
        if ($(this).hasClass('disabled')) return;
        const $link = $(this);
        $link.prop('disabled', true).text('Sending...');
        $.ajax({
            type: 'POST',
            url: $link.data('url'),
            headers: { 'X-CSRFToken': getCsrfToken() },
            success: function(response) {
                if (response.status === 'success') {
                    Swal.fire({
                        icon: 'success',
                        title: 'OTP Resent',
                        text: response.message || 'A new OTP has been sent to your email.',
                        confirmButtonColor: '#000',
                        customClass: { icon: 'black-icon' }
                    });
                    otpExpiryTime = response.expiry_time || 60;
                    clearInterval(countdownTimer);
                    countdownTimer = startTimer();
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: response.message || 'Something went wrong. Please try again.',
                        confirmButtonColor: '#000',
                        customClass: { icon: 'black-icon' }
                    });
                    $link.removeClass('disabled').text('Resend OTP');
                }
            },
            error: function(xhr) {
                let errorMessage = 'An unexpected error occurred.';
                if (xhr.responseJSON && xhr.responseJSON.message) {
                    errorMessage = xhr.responseJSON.message;
                }
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: errorMessage,
                    confirmButtonColor: '#000',
                    customClass: { icon: 'black-icon' }
                });
                $link.removeClass('disabled').text('Resend OTP');
            },
            complete: function() {
                $link.prop('disabled', false);
            }
        });
    });
});
</script>

{% endblock %}
